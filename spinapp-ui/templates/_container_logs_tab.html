<div id="epanel-logs" class="epanel">
  <div class="card" style="padding:0">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.6rem; padding:0.7rem 1rem; border-bottom:1px solid var(--border); flex-wrap:wrap">
      <span class="section-sub" style="margin:0">{{ t('logs.recent_multi_replica') | safe }}</span>
      <div style="display:flex; align-items:center; gap:0.5rem">
        <select id="logs-container-select" style="height:2.1rem"></select>
        <button type="button" id="logs-refresh-btn" class="btn-sm">{{ t('logs.refresh') }}</button>
      </div>
    </div>
    <pre id="logs-output" class="log" style="margin:0; border-radius:0; max-height:600px">{{ t('logs.loading') }}</pre>
  </div>
</div>
<script>
function refreshLogs() {
  const out = document.getElementById('logs-output');
  if (!out) return;
  out.textContent = {{ t('logs.loading') | tojson }};
  const select = document.getElementById('logs-container-select');
  const container = select ? select.value : '';
  const url = `/containers/${encodeURIComponent({{ edit_name | tojson }})}/logs` +
    (container ? `?container=${encodeURIComponent(container)}` : '');
  fetch(url)
    .then((r) => r.text())
    .then((text) => { out.textContent = text || {{ t('logs.empty') | tojson }}; })
    .catch(() => { out.textContent = {{ t('logs.fetch_failed') | tojson }}; });
}
document.addEventListener('DOMContentLoaded', function () {
  const btn = document.getElementById('logs-refresh-btn');
  if (btn) btn.addEventListener('click', refreshLogs);
  const select = document.getElementById('logs-container-select');
  if (select) select.addEventListener('change', refreshLogs);
});
</script>
