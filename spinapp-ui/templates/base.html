<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpinDeck{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --surface-2:   #f3f2ef;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:      rgba(11,11,11,0.10);
    --gridline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --series-1:    #2a78d6;   /* blue */
    --series-1-wash: rgba(42,120,214,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --surface-2:   #222221;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:      rgba(255,255,255,0.10);
      --gridline:    #2c2c2a;
      --baseline:    #383835;
      --series-1:    #3987e5;
      --series-1-wash: rgba(57,135,229,0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface-1:   #1a1a19;
    --surface-2:   #222221;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:      rgba(255,255,255,0.10);
    --gridline:    #2c2c2a;
    --baseline:    #383835;
    --series-1:    #3987e5;
    --series-1-wash: rgba(57,135,229,0.14);
  }

  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    margin: 0;
    line-height: 1.5;
  }
  a { color: var(--series-1); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .app-shell { display: flex; min-height: 100vh; align-items: stretch; }

  .sidebar {
    width: 220px; flex: none;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .sidebar-brand {
    font-weight: 600; font-size: 1.02rem; padding: 1.1rem 1.1rem 0.9rem;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand a { color: var(--text-primary); }
  .sidebar-brand a:hover { text-decoration: none; }
  nav.sidebar-nav { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.9rem 0.7rem; flex: 1; }
  nav.sidebar-nav a {
    color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
    padding: 0.55rem 0.75rem; border-radius: 8px; display: flex; align-items: center; gap: 0.55rem;
  }
  nav.sidebar-nav a:hover { background: var(--surface-2); text-decoration: none; }
  nav.sidebar-nav a.active { color: var(--text-primary); background: var(--surface-2); }
  .sidebar-footer {
    padding: 0.9rem 1.1rem 1.1rem; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .ns-tag {
    font-size: 0.78rem; color: var(--text-muted);
    background: var(--surface-2); padding: 0.2rem 0.55rem; border-radius: 6px;
    width: fit-content;
  }
  .user-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .user-row span { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .version-tag { font-size: 0.72rem; color: var(--text-muted); }

  main { flex: 1; min-width: 0; max-width: 1100px; padding: 1.75rem 2rem 4rem; }
  main.wide { max-width: none; }
  @media (max-width: 720px) {
    .app-shell { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: static;
      flex-direction: column; align-items: stretch;
    }
    .sidebar-brand { border-bottom: 1px solid var(--border); padding: 0.8rem 1rem; }
    nav.sidebar-nav {
      flex-direction: row; flex-wrap: wrap; flex: none;
      padding: 0.6rem 0.7rem; gap: 0.3rem;
    }
    nav.sidebar-nav a { padding: 0.5rem 0.7rem; font-size: 0.85rem; }
    .sidebar-footer {
      flex-direction: row; flex-wrap: wrap; align-items: center;
      gap: 0.5rem 0.8rem; padding: 0.7rem 1rem;
    }
    .user-row { flex-wrap: wrap; gap: 0.4rem; }
    main { padding: 1.25rem 1rem 3rem; }

    /* Tables opted into ".stack" (see the *.html list/table templates)
       turn each row into a labeled little card instead of squeezing
       columns or scrolling sideways -- a table with 5+ columns just
       doesn't fit a phone width no matter how it's sized. */
    table.stack, table.stack thead, table.stack tbody, table.stack tr, table.stack td {
      display: block; width: 100%;
    }
    table.stack thead { position: absolute; left: -9999px; } /* keep for screen readers, hide visually */
    table.stack tr { padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--gridline); }
    table.stack tr:last-child { border-bottom: none; }
    table.stack tr:hover td { background: none; }
    table.stack td {
      border-bottom: none; padding: 0.2rem 0; font-size: 0.86rem;
      overflow-wrap: anywhere; text-align: left !important; white-space: normal !important;
    }
    table.stack td:empty { display: none; }
    table.stack td[data-label]::before {
      content: attr(data-label); display: block; margin-bottom: 0.1rem;
      font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-muted); font-weight: 600;
    }
    /* Any table not (yet) converted to .stack still scrolls sideways
       rather than squeezing columns unreadably. */
    .card { overflow-x: auto; }
    table:not(.stack) { min-width: 560px; }

    /* Opt-in hook (see .wrap-row usages) for inline flex rows that need to
       stack instead of overflow once there's no room left to shrink. */
    .wrap-row { flex-wrap: wrap; }
  }
  @media (max-width: 480px) {
    main { padding: 1rem 0.75rem 2.5rem; }
    h1 { font-size: 1.15rem; }
  }

  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.9rem; color: var(--text-primary); }
  .section-sub { color: var(--text-secondary); font-size: 0.85rem; margin: -0.6rem 0 1rem; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--gridline);
  }
  td { padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--gridline); font-size: 0.88rem; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }

  .badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.2rem 0.6rem 0.2rem 0.5rem; border-radius: 999px; font-size: 0.78rem; font-weight: 500;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge.ok { background: rgba(12,163,12,0.12); color: var(--status-good); }
  .badge.ok .dot { background: var(--status-good); }
  .badge.bad { background: rgba(208,59,59,0.12); color: var(--status-critical); }
  .badge.bad .dot { background: var(--status-critical); }

  form.create { display: grid; gap: 0.9rem; max-width: 520px; }
  label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; display: block; margin-bottom: 0.3rem; }
  input, textarea, select {
    width: 100%; padding: 0.55rem 0.7rem; font-size: 0.9rem;
    background: var(--page); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
    box-sizing: border-box; height: 2.35rem;
  }
  textarea { height: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.83rem; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  input[readonly] { color: var(--text-muted); background: var(--surface-2); }

  button, .btn {
    padding: 0.55rem 1.1rem; font-size: 0.88rem; font-weight: 500; cursor: pointer;
    border-radius: 8px; border: 1px solid transparent; font-family: inherit;
  }
  button[type="submit"], .btn.primary {
    background: var(--series-1); color: white; border-color: var(--series-1);
  }
  button[type="submit"]:hover { filter: brightness(1.08); }
  .del-btn {
    background: none; border: none; color: var(--status-critical);
    cursor: pointer; font-size: 0.82rem; padding: 0; text-decoration: underline;
  }
  .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; white-space: nowrap; }
  /* button[type="submit"] (element+attribute selector) outweighs a single
     class in specificity, so these need the "button" element prefixed too
     or their colors get silently overridden back to the default blue. */
  button.btn-danger {
    background: var(--status-critical); color: white; border-color: var(--status-critical);
  }
  button.btn-danger:hover { filter: brightness(1.08); }
  button.btn-outline-success {
    background: none; border: 1px solid var(--status-good); color: var(--status-good);
  }
  button.btn-outline-success:hover { background: rgba(12,163,12,0.10); }
  /* Plain class (works on <a> too, unlike button.btn-outline-success
     above): a neutral bordered look for secondary actions like "export"
     links, which aren't a <button> element and don't warrant the
     .primary blue. */
  .btn.outline { border-color: var(--border); }
  .btn.outline:hover { background: var(--surface-2); }

  .error {
    background: rgba(208,59,59,0.10); color: var(--status-critical);
    padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.88rem;
  }
  .warning {
    background: rgba(250,178,25,0.12); color: #9a6a00;
    padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.88rem;
  }
  pre.log {
    background: #0f0f0e; color: #d7d6d1; padding: 0.9rem; border-radius: 8px;
    overflow-x: auto; font-size: 0.78rem; max-height: 320px; margin: 0 0 1rem;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
  .stat-tile .stat-label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
  .stat-tile .stat-value { font-size: 2rem; font-weight: 600; color: var(--text-primary); }
  .stat-tile .stat-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }

  .range-row { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
  .range-row a {
    font-size: 0.82rem; padding: 0.35rem 0.75rem; border-radius: 999px;
    color: var(--text-secondary); border: 1px solid var(--border);
  }
  .range-row a.active { background: var(--series-1); color: white; border-color: var(--series-1); }
  .range-row a:hover { text-decoration: none; border-color: var(--series-1); }

  .empty-state { color: var(--text-muted); font-size: 0.88rem; padding: 1.5rem 0; text-align: center; }

  .danger-zone { margin-top: 1.25rem; border-color: rgba(208,59,59,0.35); }
  .danger-zone h3 { color: var(--status-critical); font-size: 0.95rem; }
  .danger-zone button.del-btn {
    background: none; border: 1px solid var(--status-critical); color: var(--status-critical);
    padding: 0.5rem 1rem; font-size: 0.85rem; text-decoration: none;
  }
  .danger-zone button.del-btn:hover { background: rgba(208,59,59,0.10); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><a href="/">⚡ SpinDeck</a></div>
    <nav class="sidebar-nav">
      <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">📋 Dashboard</a>
      <a href="/apps/new" class="{{ 'active' if active_nav == 'new' else '' }}">➕ New App</a>
      <a href="/sites/new" class="{{ 'active' if active_nav == 'new_site' else '' }}">🌐 New Site</a>
      <a href="/proxies/new" class="{{ 'active' if active_nav == 'new_proxy' else '' }}">🔀 New Proxy</a>
      <a href="/crons/new" class="{{ 'active' if active_nav == 'new_cron' else '' }}">⏰ New Cron</a>
      <a href="/containers/new" class="{{ 'active' if active_nav == 'new_container' else '' }}">📦 New Container</a>
      <a href="/analytics" class="{{ 'active' if active_nav == 'analytics' else '' }}">📈 Analytics</a>
      <a href="/import" class="{{ 'active' if active_nav == 'import' else '' }}">⬆️ Import</a>
      <a href="/config" class="{{ 'active' if active_nav == 'config' else '' }}">⚙️ Config</a>
    </nav>
    <div class="sidebar-footer">
      <span class="ns-tag">ns: {{ namespace }}</span>
      {% if current_user %}
      <div class="user-row">
        <span title="{{ current_user.email or '' }}">{{ current_user.name }}</span>
        <a href="/logout">ログアウト</a>
      </div>
      {% endif %}
      <span class="version-tag">Ver. {{ spindeck_version }}</span>
    </div>
  </aside>
  <main class="{{ 'wide' if active_nav in ('new', 'new_site', 'new_proxy', 'new_cron', 'new_container', 'dashboard', 'analytics', 'config') else '' }}">
  {% block content %}{% endblock %}
  </main>
</div>
<script>
// Shared by every "delete this?"-style form: reads the confirmation text
// from a data-confirm attribute (a plain, normally-escaped HTML attribute
// value) instead of building it into an inline onsubmit="...confirm('...')"
// string. An inline event handler's *content* is HTML-entity-decoded by
// the browser before being compiled as JS, so embedding a Jinja variable
// directly into one -- even fully autoescaped for HTML -- doesn't stop a
// value containing a quote from closing the confirm() string early and
// injecting further JS (confirmed: a peer URL or console-allow-list
// username containing "'); alert(1); //" reached this exact pattern
// elsewhere in this app before being fixed). data-confirm has no such
// double-parsing step: its value is read here as a plain string, never
// re-interpreted as source code.
document.addEventListener('submit', function (e) {
  const msg = e.target.getAttribute('data-confirm');
  if (msg && !confirm(msg)) e.preventDefault();
});
</script>
</body>
</html>
