<div style="max-width:340px">
  <label>{{ t('fqdn_field.label') }}</label>
  <select name="fqdn" form="{{ form_id }}">
    <option value="">{{ t('fqdn_field.unrestricted') }}</option>
    {% for f in fqdns %}
    <option value="{{ f }}" {{ 'selected' if form_fqdn == f else '' }}>{{ f }}</option>
    {% endfor %}
  </select>
</div>
