{% extends "base.html" %}
{% block title %}SpinDeck — Import{% endblock %}
{% block content %}
<h1>Import</h1>
<p class="section-sub" style="margin-top:0">
  {{ t('import.intro') | safe }}
</p>

{% if errors %}
<div class="error">{% for e in errors %}{{ e }}<br>{% endfor %}</div>
{% endif %}

<div class="card">
  <form method="post" enctype="multipart/form-data" data-confirm="{{ t('import.confirm') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="file">{{ t('import.file_label') }}</label>
    <input type="file" id="file" name="file" accept=".json,application/json">

    <label for="json_text" style="margin-top:1rem">{{ t('import.paste_label') }}</label>
    <textarea id="json_text" name="json_text" rows="10" class="mono" placeholder='{"spindeck_export": 1, "apps": [...]}'></textarea>

    <button type="submit" class="btn-sm" style="margin-top:0.9rem">{{ t('import.submit') }}</button>
  </form>
  <p class="section-sub" style="margin-top:1rem; margin-bottom:0">
    {{ t('import.footnote') }}
  </p>
</div>
{% endblock %}
