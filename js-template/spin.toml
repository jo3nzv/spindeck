spin_manifest_version = 2

[application]
authors = ["root"]
description = ""
name = "hello-js"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "hello-js"

[component.hello-js]
source = "dist/hello-js.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = [
    # Deliberately permissive so pasted Workers-style code (which expects
    # unrestricted outbound fetch, like Cloudflare Workers) runs without
    # per-host configuration. Tighten this if that's a concern.
    "http://*:*",
    "https://*:*",
]
[component.hello-js.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.js"]